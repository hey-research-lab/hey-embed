<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The smallest policy that lets the widget run on this page:
        script-src  where <hey-project> is loaded from (production's hosted copy here);
        frame-src   heyresearch.xyz, which serves every widget frame.
      The element sets its iframe's size through the CSSOM, which style-src does not govern.
      A meta CSP cannot set frame-ancestors or report-to; send the policy as a header when you can.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://heyresearch.xyz; frame-src https://heyresearch.xyz; object-src 'none'; base-uri 'none'"
    />
    <title>HEY widget example</title>
  </head>
  <body>
    <h1>Builders we follow</h1>

    <!-- Option A: production's hosted script, always the current contract. -->
    <script src="https://heyresearch.xyz/embed/hey-project.js" async></script>

    <!--
      Option B (instead of A): this package, pinned, with subresource integrity.
      Add https://cdn.jsdelivr.net to script-src, and compute the hash of the exact file you pin:
        curl -s https://cdn.jsdelivr.net/npm/@hey-research-lab/embed@0.1.2/dist/hey-embed.iife.js \
          | openssl dgst -sha384 -binary | openssl base64 -A
      <script
        src="https://cdn.jsdelivr.net/npm/@hey-research-lab/embed@0.1.2/dist/hey-embed.iife.js"
        integrity="sha384-<hash>"
        crossorigin="anonymous"
        async
      ></script>
    -->

    <!-- By slug. The link inside is what readers see where scripts do not run. -->
    <hey-project project="hoodlock" variant="builder" theme="auto">
      <a href="https://heyresearch.xyz/project/hoodlock">HoodLock on HEY Research Lab</a>
    </hey-project>

    <!-- By Robinhood Chain contract (0x… or 4663:0x…). Other chains are not supported. -->
    <hey-project
      contract="4663:0x1234567890abcdef1234567890abcdef12345678"
      variant="compact"
      theme="dark"
      label="Builder evidence for this token's project"
    >
      <a href="https://heyresearch.xyz">Project intelligence from HEY Research Lab</a>
    </hey-project>

    <!-- No scripts allowed at all? A plain sandboxed iframe, fixed height, no resizing. -->
    <iframe
      src="https://heyresearch.xyz/embed/project/hoodlock?variant=full&amp;theme=light"
      title="HoodLock on HEY Research Lab"
      width="100%"
      height="340"
      loading="lazy"
      sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"
      style="border: 0; display: block; max-width: 100%"
    ></iframe>
  </body>
</html>
